services:
  - type: web
    name: menuhub-whatsapp-bridge
    runtime: docker
    plan: starter
    rootDir: whatsapp-bridge
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: whatsapp-session-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_AUTH_DIR
        value: /data/whatsapp-sessions
