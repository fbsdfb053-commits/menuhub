name: Build and release Fb3d2y Print Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-print/**'
      - '.github/workflows/fb3d2y-print-windows.yml'
      - 'windows-print/installer/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Gerar ícone do aplicativo
        shell: pwsh
        run: ./windows-print/GenerateIcon.ps1
      - name: Publicar aplicativo Windows
        run: dotnet publish windows-print/Fb3d2yPrint.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Criar instalador Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows-print/installer/Fb3d2yPrint.iss
      - name: Publicar atualização v0.2.8
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fb3d2y-print-v0.2.8
          name: Fb3d2y Print 0.2.8
          target_commitish: feat/fb3d2y-print-windows
          files: |
            artifacts/Fb3d2yPrint-Setup.exe
            windows-print/bin/Release/net8.0-windows/win-x64/publish/Fb3d2yPrint.exe
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
