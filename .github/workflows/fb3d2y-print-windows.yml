name: Build Fb3d2y Print Windows
on:
  workflow_dispatch:
  push:
    branches: [feat/fb3d2y-print-windows]
    paths:
      - 'windows-print/**'
      - '.github/workflows/fb3d2y-print-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publicar aplicativo Windows
        run: dotnet publish .\windows-print\Fb3d2yPrint.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: Fb3d2y-Print-Windows-x64
          path: windows-print/bin/Release/net8.0-windows/win-x64/publish/Fb3d2yPrint.exe
          if-no-files-found: error
