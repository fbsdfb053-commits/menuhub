name: Build Fb3d2y Menu APK

on:
  workflow_dispatch:
  push:
    branches: [app-android]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    name: Gerar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        working-directory: mobile
        run: npm install

      - name: Garantir módulos nativos usados pelo app
        working-directory: mobile
        run: npx expo install react-native-safe-area-context expo-keep-awake expo-speech expo-print expo-sharing expo-file-system expo-intent-launcher expo-av

      - name: Verificar TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Gerar projeto Android nativo
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: fb3d2y-menu-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Ler versão do aplicativo
        id: app
        working-directory: mobile
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar APK para atualização pelo aplicativo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app.outputs.version }}
          name: Fb3d2y Menu v${{ steps.app.outputs.version }}
          target_commitish: app-android
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true

